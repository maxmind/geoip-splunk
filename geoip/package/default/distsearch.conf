# Knowledge bundle replication rules for running the geoip command on indexers.
# Splunk merges these stanzas with its system defaults; the key names are
# namespaced with geoip_ so they never clobber other entries.

[replicationAllowlist]
# Splunk's default allowlist replicates app bin/ and lookups/ directories but
# not lib/. Replicate the minimal set of libraries the geoip command imports at
# search time on an indexer (about 0.9 MB). The remaining vendored libraries
# (grpc, aiohttp, opentelemetry, ...; about 35 MB) are only needed for
# downloading databases on the search head and deliberately stay out of the
# bundle.
geoip_lib_geoip_utils = apps/geoip/lib/geoip_utils.py
geoip_lib_splunklib = apps/geoip/lib/splunklib/...

# maxminddb* also matches the maxminddb-<version>.dist-info directory, which
# maxminddb/__init__.py reads at import time via importlib.metadata.version() -
# without it the command crashes on the indexer.
geoip_lib_maxminddb = apps/geoip/lib/maxminddb*/...

# The MaxMind databases live in the app's databases/ directory, which is not
# in Splunk's default allowlist, so while the toggle is off nothing there
# (the databases, the updater's in-progress *.temporary downloads, its lock
# file) rides the knowledge bundle at all. This key decides whether the
# databases replicate to indexers: indexer execution is opt-in because large
# databases can exceed bundle replication size limits, so the shipped default
# is a placeholder pattern that matches no real file. It is deliberately not
# an empty value, which in an allowlist matches everything, and the key
# cannot simply be dropped: conf keys cannot be deleted through the REST API.
# Enabling "Run on indexers" in the app's settings overrides this key in
# local/distsearch.conf with the real apps/geoip/databases/*.mmdb pattern,
# which still leaves out the scratch files - pygeoipupdate names its
# in-progress downloads <edition>_<random>.temporary, so *.mmdb misses them
# and the lock file alike.
geoip_mmdb = apps/geoip/databases/allow-nothing-placeholder
