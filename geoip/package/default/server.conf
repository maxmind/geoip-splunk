# UCC only generates default/server.conf when the source package does not ship
# one (see create_server_conf.py in addonfactory-ucc-generator). Because we
# ship this file, the conf_replication_include lines UCC would have generated
# for the app's custom conf files must be maintained here by hand.

[shclustering]
# Replicate the app's custom conf files across search head cluster members.
# These two lines are what UCC would have generated.
conf_replication_include.geoip_settings = true
conf_replication_include.geoip_databases = true

# distsearch is not in Splunk's default conf_replication_include list. Include
# it so the local/distsearch.conf override written when toggling indexer
# execution (see geoip_rh_settings.py) reaches all members. Verified on a live
# cluster: splunkd does honour the include for a conf type absent from its
# default list, and both local/distsearch.conf and local/geoip_settings.conf
# reached the non-captain member.
#
# Note the scope: [shclustering] keys from every app merge into one effective
# server.conf, so this is not limited to this app's file. It turns on
# replication for every runtime distsearch.conf change on the members,
# including etc/system/local and other apps'. distsearch.conf can carry
# member-specific settings ([distributedSearch] servers/disabled,
# [replicationSettings], [tokenExchKeys] certDir, genKeyScript), so an admin
# who changes one of those through REST on one member will now have it
# journaled to the others. There is no app-scoped alternative: the include
# list is keyed by conf name.
conf_replication_include.distsearch = true

# Note: no conf_replication_summary.* keys are needed for the MaxMind
# databases. They live in the app's databases/ directory, which SHC
# replication summaries never capture (only local/, lookups/, and metadata
# are summarized) - and AppInspect rejects conf_replication_summary
# overrides in an app's server.conf in any case.
