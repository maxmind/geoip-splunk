name: Tests

on:
  push:
  pull_request:
  schedule:
    - cron: '3 15 * * SUN'

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      - name: Install uv with mise
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: aqua:astral-sh/uv

      - name: Install Python
        run: uv python install --python-preference only-managed 3.13

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest tests
